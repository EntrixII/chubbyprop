<article class="property-card reveal" id="{{ 'land' if 'Land' in property.category else 'building' }}">
  <a class="property-image-wrap" href="{{ url_for('property_detail', slug=property.slug) }}">
    <img src="{{ url_for('static', filename='images/' + property.image) }}" alt="{{ property.image_alt }}">
    <span class="property-badge">{{ property.listing_type }}</span>
  </a>
  <div class="property-card-body">
    <div class="property-card-topline"><span>{{ property.category }}</span><span class="dot-separator">•</span><span>{{ property.location.split(',')[0] }}</span></div>
    <h3><a href="{{ url_for('property_detail', slug=property.slug) }}">{{ property.short_title }}</a></h3>
    <div class="property-meta"><span><i data-lucide="map-pin"></i>{{ property.location }}</span>{% if property.availability %}<span><i data-lucide="layers-3"></i>{{ property.availability }}</span>{% endif %}</div>
    <div class="property-card-footer">
      <div><small>Asking price</small><strong>{{ property.price }}</strong></div>
      <div class="property-actions">
        <a class="text-link" href="{{ url_for('property_detail', slug=property.slug) }}">View Details <i data-lucide="arrow-up-right"></i></a>
        <a class="button button-dark button-small" href="{{ property.whatsapp_url }}" target="_blank" rel="noopener">Buy / Enquire</a>
      </div>
    </div>
  </div>
</article>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Chubby Properties</title>
  <meta name="description" content="{{ meta_description }}">
  <meta name="theme-color" content="#0b1728">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }} | Chubby Properties">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:site_name" content="Chubby Property Development Ltd">
  <link rel="canonical" href="{{ request.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    {% include 'partials/navbar.html' %}
    <main id="main-content">{% block content %}{% endblock %}</main>
    {% include 'partials/footer.html' %}
  </div>
  <a class="floating-whatsapp" href="{{ whatsapp_url }}" target="_blank" rel="noopener" aria-label="Chat with Chubby Properties on WhatsApp">
    <i data-lucide="message-circle"></i><span>Chat with an agent</span>
  </a>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
